      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'Arial', 'Helvetica', 'sans-serif'],
          },
          colors: {
            greenLoop: '#0F6E56',
            emeraldLoop: '#1D9E75',
            mintLoop: '#5DCAA5',
            darkLoop: '#12332B',
            lightLoop: '#E8F5EF',
            surfaceLoop: '#F5FAF7',
            grayLoop: '#64756E',
            borderLoop: '#DCEAE3',
          },
          boxShadow: {
            loop: '0 8px 25px rgba(18, 51, 43, 0.08)',

          },
        },
      },
    };
  </script>

  <style>
    :root {
      --green: #0F6E56;
      --emerald: #1D9E75;
      --mint: #5DCAA5;
      --dark: #12332B;
      --light: #E8F5EF;
      --white: #FFFFFF;
      --gray: #64756E;
      --border: #DCEAE3;
      --shadow: 0 8px 25px rgba(18, 51, 43, 0.08);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Inter', Arial, Helvetica, sans-serif;
      background-color: #F5FAF7;
      color: var(--dark);
      line-height: 1.6;
      overflow-x: hidden;
    }

    button, input, textarea, select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* Staggered Reveal Animations */
    @keyframes revealUp {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .reveal-anim {
      opacity: 0;
      animation: revealUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .delay-1 { animation-delay: 0.08s; }
    .delay-2 { animation-delay: 0.16s; }
    .delay-3 { animation-delay: 0.24s; }

    /* Interactive Card Hover & Tactile Button Feedback */
    .loop-card {
      box-shadow: var(--shadow);
      transition: transform 0.24s cubic-bezier(0.22, 1, 0.36, 1),
                  box-shadow 0.24s cubic-bezier(0.22, 1, 0.36, 1),
                  border-color 0.24s ease;
    }

    .loop-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 18px 40px rgba(15, 110, 86, 0.14);
      border-color: var(--mint);
    }

    .btn-tactile {
      transition: transform 0.14s ease, background-color 0.2s ease, box-shadow 0.2s ease;
    }

    .btn-tactile:active {
      transform: scale(0.97);
    }

    /* 3D Auto-Flipping Civic Awareness Banner Styles */
    .awareness-perspective {
      perspective: 1300px;
    }

    @keyframes awareness3DFlip {
      0% {
        opacity: 0;
        transform: rotateX(-22deg) rotateY(10deg) scale(0.96) translateY(12px);
      }
      55% {
        opacity: 1;
        transform: rotateX(3deg) rotateY(-2deg) scale(1.005) translateY(-2px);
      }
      100% {
        opacity: 1;
        transform: rotateX(0deg) rotateY(0deg) scale(1) translateY(0);
      }
    }

    .awareness-flip-enter {
      transform-style: preserve-3d;
      backface-visibility: hidden;
      animation: awareness3DFlip 0.72s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes progressFill {
      from { width: 0%; }
      to { width: 100%; }
    }

    .awareness-progress-anim {
      animation: progressFill 4.5s linear forwards;
    }

    .awareness-paused {
      animation-play-state: paused !important;
    }

    /* Toast Notification */
    @keyframes toastPop {
      from {
        opacity: 0;
        transform: translateY(16px) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .toast-visible {
      display: flex !important;
      animation: toastPop 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Animated Gradient & Floating Orbs for Full-Screen Login / Signup Gate */
    @keyframes ecoGradientFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .animated-gate-bg {
      background: linear-gradient(-45deg, #0B4F3E, #0F6E56, #1D9E75, #12332B);
      background-size: 300% 300%;
      animation: ecoGradientFlow 14s ease infinite;
    }

    @keyframes orbFloatA {
      0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
      50% { transform: translate3d(20px, -22px, 0) scale(1.06); }
    }

    @keyframes orbFloatB {
      0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
      50% { transform: translate3d(-24px, 18px, 0) scale(0.95); }
    }

    .gate-orb-1 { animation: orbFloatA 9s ease-in-out infinite; }
    .gate-orb-2 { animation: orbFloatB 11s ease-in-out infinite; }
  </style>
</head>
